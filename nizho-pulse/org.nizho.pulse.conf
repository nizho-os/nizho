<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy user="root">
    <allow own="org.nizho.pulse"/>
  </policy>
  <policy context="default">
    <!-- Read-only surface: property reads + introspection only. There is no
         mutating method on org.nizho.pulse (reliability only ever reports), so
         no send_member is granted for one. -->
    <allow send_destination="org.nizho.pulse"
           send_interface="org.freedesktop.DBus.Properties"/>
    <allow send_destination="org.nizho.pulse"
           send_interface="org.freedesktop.DBus.Introspectable"/>
    <allow receive_sender="org.nizho.pulse"/>
  </policy>
</busconfig>

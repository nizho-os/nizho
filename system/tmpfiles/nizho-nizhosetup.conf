# Home of the first-boot setup account. Disk images made by `bootc install`
# copy it from the image's /var, but Anaconda (the installer ISO) does not, and
# a separate /home volume would hide it. Recreate it at boot when missing; "C"
# copies only if the file is absent, so nothing is overwritten.
d /var/home/nizhosetup 0700 nizhosetup nizhosetup -
C /var/home/nizhosetup/.bash_profile - - - - /usr/share/nizho/nizhosetup/.bash_profile
C /var/home/nizhosetup/.hushlogin - - - - /usr/share/nizho/nizhosetup/.hushlogin
z /var/home/nizhosetup/.bash_profile 0644 nizhosetup nizhosetup -
z /var/home/nizhosetup/.hushlogin 0644 nizhosetup nizhosetup -

[package]
name = "nizho-update"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "nizho-update"
path = "src/main.rs"

[dependencies]
nizho-shell-common = { path = "../nizho-shell-common", features = ["adw"] }
gtk4 = "0.9"
libadwaita = { version = "0.7", features = ["v1_4"] }
glib = "0.20"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[package]
name = "nizho-dashboard"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "nizho-dashboard"
path = "src/main.rs"

[dependencies]
nizho-shell-common = { path = "../nizho-shell-common", features = ["adw"] }
nizho-update = { path = "../nizho-update" }
libadwaita = { version = "0.7", features = ["v1_4"] }
gtk4 = "0.9"
glib = "0.20"
futures = "0.3"
tokio = { version = "1", features = ["full"] }
zbus = { version = "4", features = ["tokio"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

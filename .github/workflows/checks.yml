name: Source checks

on:
  push:
    paths:
      - "scripts/test-build-context.py"
      - "scripts/copy-map.py"
      - ".containerignore"
      - "cosign.pub"
      - "system/containers/**"
      - "scripts/test-signing.py"
      - "scripts/test-showdesktop.py"
      - "scripts/test-dock-start.py"
      - ".github/workflows/image.yml"
      - ".github/workflows/pages.yml"
      - "nizhod/**"
      - "nizho-pulse/**"
      - "nizho-shell/**"
      - "system/nizho-oobe-apply"
      - "system/nizho-firstboot"
      - "system/nizho-plasma-firstrun"
      - "Containerfile"
      - "archon-service/**"
      - "integrations/archon/**"
      - "nizho-shell/nizho-capsule/**"
      - "scripts/*archon*"
      - ".github/workflows/archon.yml"
      - "scripts/test-oobe-apply.py"
      - "system/nizho-firefox"
      - "scripts/test-firefox-wrapper.py"
      - "scripts/flash-usb.sh"
      - "scripts/test-flash-preflight.py"
      - "system/systemd/nizho-bootc-status.*"
      - ".github/workflows/checks.yml"
      - "convert/**"
      - "system/nizho-arm-boot-counter"
      - "desktop/plymouth-theme-nizho/**"
      - "scripts/test-nizho-convert.py"
      - "scripts/test-wheel-formats.py"
      - "scripts/test-edit-window.py"
      - "scripts/test-arm-boot-counter.py"
      - "scripts/qml/**"
  pull_request:
    paths:
      - "scripts/test-build-context.py"
      - "scripts/copy-map.py"
      - ".containerignore"
      - "cosign.pub"
      - "system/containers/**"
      - "scripts/test-signing.py"
      - "scripts/test-showdesktop.py"
      - "scripts/test-dock-start.py"
      - ".github/workflows/image.yml"
      - ".github/workflows/pages.yml"
      - "nizhod/**"
      - "nizho-pulse/**"
      - "nizho-shell/**"
      - "system/nizho-oobe-apply"
      - "system/nizho-firstboot"
      - "system/nizho-plasma-firstrun"
      - "Containerfile"
      - "archon-service/**"
      - "integrations/archon/**"
      - "nizho-shell/nizho-capsule/**"
      - "scripts/*archon*"
      - ".github/workflows/archon.yml"
      - "scripts/test-oobe-apply.py"
      - "system/nizho-firefox"
      - "scripts/test-firefox-wrapper.py"
      - "scripts/flash-usb.sh"
      - "scripts/test-flash-preflight.py"
      - "system/systemd/nizho-bootc-status.*"
      - ".github/workflows/checks.yml"
      - "convert/**"
      - "system/nizho-arm-boot-counter"
      - "desktop/plymouth-theme-nizho/**"
      - "scripts/test-nizho-convert.py"
      - "scripts/test-wheel-formats.py"
      - "scripts/test-edit-window.py"
      - "scripts/test-arm-boot-counter.py"
      - "scripts/qml/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  setup:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install the cosign version that signs the images
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: v2.4.1
      - name: Test image signing and verification
        run: python3 -I scripts/test-signing.py
      - name: Test the Meta+D Show Desktop that keeps the dock
        run: python3 -I scripts/test-showdesktop.py
      - name: Test that old dock pins are renamed so one app shows one icon
        run: python3 -I scripts/test-dock-start.py
      - name: Test that the repository layout matches what the image build copies
        run: python3 -I scripts/test-build-context.py
      - name: Test the nizho install, remove and update command
        run: cd apps && python3 -m unittest test_nizho_install
      - name: Test nizho-backup against the real restic
        run: sudo apt-get install -y restic && cd backup && python3 -m unittest test_nizho_backup
      - name: Test nizho-import with real files
        run: cd import && python3 -I test_nizho_import.py
      - name: Test nizho-hwreport on fake system trees
        run: cd hardware && python3 -I test_nizho_hwreport.py
      - name: Check shell helpers
        run: shellcheck system/nizho-oobe-apply system/nizho-plasma-firstrun system/nizho-firefox system/nizho-firstboot scripts/flash-usb.sh
      - name: Check first-run shell syntax
        run: bash -n system/nizho-oobe-apply && bash -n system/nizho-firstboot
      - name: Test setup with isolated accounts and paths
        run: python3 scripts/test-oobe-apply.py
      - name: Test USB source preflight without devices
        run: python3 scripts/test-flash-preflight.py
      - name: Test browser sandbox launch boundary
        run: bash -n system/nizho-firefox && python3 scripts/test-firefox-wrapper.py
      - name: Test that the format wheel offers only what nizho-convert accepts
        run: python3 scripts/test-wheel-formats.py
      - name: Test the boot counter's failure paths with fake commands
        run: sh -n system/nizho-arm-boot-counter && python3 scripts/test-arm-boot-counter.py
      - name: Test the phone-link helper against a fake firewall-cmd
        run: sh -n system/nizho-phone-link && python3 -I scripts/test-phone-link.py
      - name: Test nizho install (permission wording and the app list)
        run: python3 -I -m unittest discover -s apps -p 'test_*.py'

  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Select stable Rust
        run: rustup default stable
      - name: Test privacy enforcement
        # Authorization tests use their own session bus, never the host system bus.
        run: cargo test --locked --manifest-path nizhod/Cargo.toml
      - name: Test reliability core
        run: cargo test --locked --manifest-path nizho-pulse/Cargo.toml --features dbus
      - name: Test shared privacy states and tray
        run: cargo test --locked --manifest-path nizho-shell/Cargo.toml -p nizho-shell-common -p nizho-privacy-tray

  desktop:
    runs-on: ubuntu-24.04
    # Same environment the image builds these apps in (Containerfile
    # shell-builder): Ubuntu has no gtk4-layer-shell, which the privacy dots need.
    container: docker.io/library/fedora:44
    steps:
      - uses: actions/checkout@v4
      - name: Install desktop build dependencies
        run: dnf install -y -q gtk4-devel gtk4-layer-shell-devel libadwaita-devel rust cargo gcc pkgconf-pkg-config
      - name: Test every desktop crate including first-run setup
        run: cargo test --locked --manifest-path nizho-shell/Cargo.toml --workspace
      - name: Test desktop backends without a display or host services
        run: |
          rustc --edition=2021 --test nizho-shell/nizho-perms/src/permissions.rs -o /tmp/perms-tests
          /tmp/perms-tests
          rustc --edition=2021 --test nizho-shell/nizho-wifi/src/net.rs -o /tmp/wifi-tests
          /tmp/wifi-tests
          rustc --edition=2021 --test nizho-shell/nizho-sound/src/audio.rs -o /tmp/sound-tests
          /tmp/sound-tests
          rustc --edition=2021 --test nizho-shell/nizho-update/src/operation.rs -o /tmp/update-tests
          /tmp/update-tests

  convert:
    runs-on: ubuntu-24.04
    # The tools the image ships (ffmpeg, Pillow, mat2, tesseract, bubblewrap, Qt), so the converter, the
    # wheel and the edit window are tested against the same versions. Privileged: nizho-convert runs every
    # tool in a bubblewrap sandbox, which needs user namespaces inside the job's container.
    container:
      image: docker.io/library/fedora:44
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - name: Install the converters and Qt
        run: |
          dnf install -y -q ffmpeg-free python3-pillow poppler-utils ghostscript bubblewrap mat2 \
            tesseract tesseract-langpack-eng cmake gcc-c++ extra-cmake-modules qt6-qtbase-devel \
            qt6-qtdeclarative-devel qt6-qtmultimedia kf6-kglobalaccel-devel kf6-kwindowsystem-devel \
            layer-shell-qt-devel dbus-daemon
      - name: Test nizho-convert with real files in the real sandbox
        run: python3 scripts/test-nizho-convert.py
      - name: Test the wheel's slots against nizho-convert
        run: python3 scripts/test-wheel-formats.py
      - name: Test the wheel's QML
        run: QT_QPA_PLATFORM=offscreen /usr/lib64/qt6/bin/qmltestrunner -input scripts/qml/tst_format_wheel.qml
      - name: Build the edit window and the wheel
        run: cmake -S convert -B /tmp/convert-build -DCMAKE_BUILD_TYPE=Release && cmake --build /tmp/convert-build -j"$(nproc)"
      - name: Drive the edit window and check what it saves
        run: NIZHO_EDIT=/tmp/convert-build/edit/nizho-edit python3 scripts/test-edit-window.py

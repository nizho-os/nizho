name: Redirect the old website address

# The website moved to its own repository, nizho-os/nizhoweb, and is served at
# https://nizho-os.github.io/nizhoweb/. This keeps the old address,
# https://nizho-os.github.io/nizho/, sending visitors there, page and anchor included.

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5 (v5.0.0)
        with:
          enablement: true
      - name: Write the redirect pages
        run: |
          page() {
            mkdir -p "_site/$1"
            cat > "_site/$1/$2" <<HTML
          <!doctype html>
          <html lang="en"><head><meta charset="utf-8">
          <title>Nizho has moved</title>
          <link rel="canonical" href="https://nizho-os.github.io/nizhoweb/$1">
          <meta http-equiv="refresh" content="0; url=https://nizho-os.github.io/nizhoweb/$1">
          <script>location.replace("https://nizho-os.github.io/nizhoweb/" + location.pathname.replace(/^\/nizho\/?/, "") + location.search + location.hash);</script>
          </head><body><p>The Nizho website moved to <a href="https://nizho-os.github.io/nizhoweb/$1">nizho-os.github.io/nizhoweb</a>.</p></body></html>
          HTML
          }
          page "" index.html
          page docs/ index.html
          page "" 404.html
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3 (v3.0.1)
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4 (v4.0.5)

name: Deploy website to GitHub Pages

# Publishes the static site in website/ to GitHub Pages.
# One-time setup: repo Settings → Pages → Build and deployment →
#   Source: "GitHub Actions".

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; let a new push cancel an in-progress run.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 (v4.4.0)
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5 (v5.0.0)
        with:
          enablement: true   # turn Pages on via this workflow's token — no manual Settings step
      # Videos live on the "media" GitHub Release, not in the repository. They
      # are copied into the published site here, so the page plays them from
      # its own address. A missing video never blocks a deploy.
      - name: Fetch videos from the media release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p website/media
          gh release download media --repo "$GITHUB_REPOSITORY" --pattern '*.mp4' --dir website/media \
            || echo "No media release yet; deploying without videos."
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3 (v3.0.1)
        with:
          path: website
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4 (v4.0.5)

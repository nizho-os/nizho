name: Image

# Builds the Nizho bootc image, splits it into many small layers so an update
# downloads only what changed, signs it, and publishes it to
# ghcr.io/nizho-os/nizho. Installed systems only accept images signed
# with the key whose public half is cosign.pub (see system/containers/).

on:
  pull_request:
    paths:
      - "Containerfile"
      - "archon-service/**"
      - "integrations/archon/**"
      - "nizho-shell/nizho-capsule/**"
      - "scripts/vm/**"
      - ".github/workflows/image.yml"
  push:
    # test/* branches are built and checked but never published.
    branches: [main, "test/**"]
    paths-ignore:
      - "docs/**"
      - "website/**"
      - "assets/**"
      - "**.md"
  schedule:
    - cron: "17 3 * * 1"   # weekly, to pick up Fedora security updates
  workflow_dispatch:

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/nizho-os/nizho

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - name: Refuse to publish without the signing key
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/test/')
        env:
          SIGNING_SECRET: ${{ secrets.SIGNING_SECRET }}
        run: |
          if [ -z "$SIGNING_SECRET" ]; then
            echo "::error::SIGNING_SECRET is not set; an unsigned image would be rejected by Nizho"
            exit 1
          fi

      - name: Make room (the image is about 12 GB, built twice)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo mkdir -p /mnt/containers /var/lib/containers
          sudo mount --bind /mnt/containers /var/lib/containers
          df -h / /mnt

      - uses: actions/checkout@v4

      - name: Build
        run: |
          sudo podman build --pull=newer \
            --label org.opencontainers.image.source=https://github.com/${{ github.repository }} \
            --label org.opencontainers.image.revision=${{ github.sha }} \
            -t localhost/nizho:build .

      - name: Split into small layers
        run: |
          sudo podman run --rm --privileged --security-opt label=disable \
            -v /var/lib/containers:/var/lib/containers \
            quay.io/fedora/fedora-bootc:44 \
            rpm-ostree compose build-chunked-oci --bootc --format-version=1 \
              --from=localhost/nizho:build \
              --output=containers-storage:localhost/nizho:chunked
          sudo podman rmi localhost/nizho:build
          sudo podman image inspect localhost/nizho:chunked --format '{{len .RootFS.Layers}} layers'

      - name: Push
        if: github.ref == 'refs/heads/main'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$TOKEN" | sudo podman login ghcr.io -u "${{ github.actor }}" --password-stdin
          ver=44.$(date -u +%Y%m%d)
          sudo podman push --digestfile digest localhost/nizho:chunked "docker://$IMAGE:latest"
          sudo podman push localhost/nizho:chunked "docker://$IMAGE:$ver"
          sudo podman push localhost/nizho:chunked "docker://$IMAGE:sha-${GITHUB_SHA::7}"
          echo "DIGEST=$(sudo cat digest)" >> "$GITHUB_ENV"

      # test/* branches publish only to the candidate tags, never to latest, so an image can be made
      # into a disk (Stick image, tag: candidate) and booted before it is merged. Installed machines
      # follow latest and never move to a candidate on their own.
      - name: Push candidate
        if: startsWith(github.ref, 'refs/heads/test/')
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$TOKEN" | sudo podman login ghcr.io -u "${{ github.actor }}" --password-stdin
          sudo podman push --digestfile digest localhost/nizho:chunked "docker://$IMAGE:candidate"
          sudo podman push localhost/nizho:chunked "docker://$IMAGE:candidate-${GITHUB_SHA::7}"
          echo "DIGEST=$(sudo cat digest)" >> "$GITHUB_ENV"

      - uses: sigstore/cosign-installer@v3
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/test/')
        with:
          cosign-release: v2.4.1

      - name: Sign and verify
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/test/')
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          COSIGN_PASSWORD: ""
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cosign login ghcr.io -u "${{ github.actor }}" -p "$TOKEN"
          cosign sign -y --key env://COSIGN_PRIVATE_KEY "$IMAGE@$DIGEST"
          cosign verify --key cosign.pub "$IMAGE@$DIGEST" > /dev/null
          echo "Published and signed: $IMAGE@$DIGEST"

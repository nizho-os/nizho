version: 2
# One grouped pull request per week per ecosystem, for minor and patch updates
# only. Major versions change APIs (zbus, glib, toml, ...) and are planned and
# VM-tested by hand instead of proposed automatically.
updates:
  - package-ecosystem: cargo
    directories: ["/nizhod", "/nizho-shell", "/nizho-pulse", "/nizho-agent"]
    schedule: { interval: weekly }
    groups:
      rust:
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      actions:
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
